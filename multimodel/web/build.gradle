plugins {
    id 'java'
}

dependencies {
    // Multi-module dependencies
    implementation project(':service')
    implementation project(':data')
    implementation project(':util')

    // Spring Boot dependencies with explicit versions
    implementation 'org.springframework.boot:spring-boot-starter-web:3.3.4'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.3.4'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    runtimeOnly 'com.mysql:mysql-connector-j:8.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.4'
}

jar {
    archiveBaseName.set('mo')
}

// -----------------------------
// Manual bootRun
// -----------------------------
tasks.create('bootRun', JavaExec) {
    group = 'application'
    description = 'Runs the Spring Boot application manually'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set("com.multimodule.web.WebApplication")
}

// -----------------------------
// Manual bootJar (fat jar)
// -----------------------------
tasks.create('bootJar', Jar) {
    group = 'build'
    description = 'Builds a runnable fat JAR manually'
    archiveBaseName.set('mo')
    archiveVersion.set('0.0.1-SNAPSHOT')
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    manifest { attributes 'Main-Class': 'com.multimodule.web.WebApplication' }
}

// Optional: build depends on bootJar
build.dependsOn bootJar
